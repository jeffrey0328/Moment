name: Build native apps

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ secrets.MOMENT_API_URL }}
      - run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Give APK a readable name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Moment-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: Moment-Android-APK
          path: Moment-*-Android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ secrets.MOMENT_API_URL }}
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: Moment-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: Moment-Android-APK
          path: dist-release
      - uses: actions/download-artifact@v6
        with:
          name: Moment-Windows-Installer
          path: dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
