name: Build native apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ secrets.MOMENT_API_URL }}
      - run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Give APK a readable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Moment-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moment-Android-APK
          path: Moment-Android-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ secrets.MOMENT_API_URL }}
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Moment-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

